name: TBLive conformance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: tblive-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/conformance/html-surfaces.mjs
      - run: node tests/conformance/tblive-1.33.mjs

  report:
    if: always()
    needs: static-surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Report TBLive test run
        env:
          TBLIVE_TEST_RUNS_TOKEN: ${{ secrets.TBLIVE_TEST_RUNS_TOKEN }}
          TEST_STATUS: ${{ needs.static-surfaces.result }}
        run: |
          if [ -z "$TBLIVE_TEST_RUNS_TOKEN" ]; then
            echo "TBLIVE_TEST_RUNS_TOKEN is required for release conformance reporting" >&2
            exit 1
          fi
          status="$TEST_STATUS"
          [ "$status" = "success" ] && status=success
          [ "$status" = "cancelled" ] && status=cancelled
          [ "$status" != "success" ] && [ "$status" != "cancelled" ] && status=failure
          export REPORT_STATUS="$status"
          curl --fail-with-body -X POST "https://tblive.triviabranch.com/api/admin/test-runs" \
            -H "authorization: Bearer $TBLIVE_TEST_RUNS_TOKEN" \
            -H "content-type: application/json" \
            --data "$(node -e 'const now=new Date().toISOString(); console.log(JSON.stringify({gameId:"grabble",gameName:"Grabble",runId:process.env.GITHUB_RUN_ID,workflow:process.env.GITHUB_WORKFLOW,branch:process.env.GITHUB_REF_NAME,commitSha:process.env.GITHUB_SHA,runUrl:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID,status:process.env.REPORT_STATUS,startedAt:now,completedAt:now,contractVersion:"1.33",testName:"TBLive 1.33 conformance",message:"Static and protocol conformance workflow"}))' )"
