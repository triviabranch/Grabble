name: TBLive conformance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: tblive-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/conformance/html-surfaces.mjs
